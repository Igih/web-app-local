server {
    listen 80;
    server_name 192.168.14.28;

       

    location /api/ {
        
        limit_conn conn_limit_per_ip 10;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # client_max_body_size 50G; # 支持大文件元数据
        proxy_buffer_size 128k; # 适配50MB块
        proxy_buffers 16 256k;
        proxy_busy_buffers_size 512k;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;  # 如果文件不存在，返回 404
        expires 30d;
    }

    location /static/ {
        alias /usr/share/nginx/html/;
        expires 30d;
    }

    location /category_images/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    location /browse_folders/ {
            alias /home/linux/Downloads/;
            expires 30d; # 缓存30天
            add_header Cache-Control "public, immutable";
            access_log off; # 关闭访问日志以减少I/O
            log_not_found off; # 关闭404日志
            autoindex off; # 禁用目录列表
            sendfile on; # 启用sendfile
            tcp_nopush on; # 优化静态文件传输
            try_files $uri =404; # 如果文件不存在，返回404
        }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Error and access logs
    access_log /var/log/nginx/yourapp_access.log;
    error_log /var/log/nginx/yourapp_error.log;
}